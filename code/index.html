<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>ユーザー登録フォーム</title>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width: 640px;">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>ユーザー登録フォーム</h4>
        </div>
        <div class="card-body">
          <form>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="userNameInput" class="form-label">社員名</label>
                <input type="text" class="form-control" id="userNameInput" placeholder="マツダ 太郎">
              </div>
              <div class="col-md-3">
                <label for="birthdayInput" class="form-label">誕生日</label>
                <input type="date" class="form-control" id="birthdayInput">
              </div>
              <div class="col-md-3">
                <label for="ageInput" class="form-label">年齢 <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="ageInput" placeholder="30" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">性別</label>
              <div class="d-flex gap-3">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="genderRadio" id="maleRadio" value="男性">
                  <label class="form-check-label" for="maleRadio">男性</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="genderRadio" id="femaleRadio" value="女性">
                  <label class="form-check-label" for="femaleRadio">女性</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="genderRadio" id="otherRadio" value="その他">
                  <label class="form-check-label" for="otherRadio">その他</label>
                </div>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="departmentSelect" class="form-label">部門</label>
                <select class="form-select" id="departmentSelect">
                  <option value="">なし</option>
                  <option value="A部門">A部門</option>
                  <option value="B部門">B部門</option>
                  <option value="C部門">C部門</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="relatedDepartmentSelect" class="form-label">関連部門</label>
                <select class="form-select" id="relatedDepartmentSelect" multiple>
                  <option value="A部門">A部門</option>
                  <option value="B部門">B部門</option>
                  <option value="C部門">C部門</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="contactCheck">
                <label class="form-check-label" for="contactCheck">連絡可能</label>
              </div>
            </div>

            <div class="mb-3">
              <label for="remarksTextarea" class="form-label">備考</label>
              <textarea class="form-control" id="remarksTextarea" rows="3"></textarea>
            </div>

            <div class="mb-4">
              <label for="fileInput" class="form-label">ファイルアップロード</label>
              <input class="form-control" type="file" id="fileInput">
            </div>

            <div class="d-flex gap-2 justify-content-end">
              <button type="button" id="cancelButton" class="btn btn-outline-secondary px-4">
                <i class="bi bi-x-circle me-1"></i>キャンセル
              </button>
              <button type="submit" id="submitButton" class="btn btn-primary px-4">
                <i class="bi bi-check-circle me-1"></i>登録
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
